    <style>.leaderboard-container{flex:1;padding:30px;background:#fffffff2;border-radius:16px;box-shadow:0 4px 20px #00000014;margin:20px;display:flex;flex-direction:column;height:calc(100vh - 80px);min-height:calc(100vh - 80px)}.leaderboard-header{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:24px;padding-bottom:16px;border-bottom:2px solid #e3f2fd}.leaderboard-title{font-size:32px;font-weight:600;color:#4a90e2;margin:0;letter-spacing:-.5px}.assignment-selector{display:flex;align-items:center;gap:12px}.assignment-selector label{font-size:14px;color:#5a6c7d;font-weight:500}.assignment-dropdown{padding:8px 16px;font-size:14px;border:2px solid #b8d4f1;border-radius:8px;background:#fff;color:#2c3e50;cursor:pointer;transition:all .2s ease;outline:none}.assignment-dropdown:hover{border-color:#4a90e2}.assignment-dropdown:focus{border-color:#4a90e2;box-shadow:0 0 0 3px #4a90e21a}.table-wrapper{flex:1;overflow-y:auto;position:relative}.table-controls{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;padding:12px 16px;background:#e3f2fd4d;border-radius:8px}.controls-left{display:flex;gap:8px}.controls-right{display:flex;align-items:center;gap:16px}.refresh-button{width:auto;min-width:72px;height:36px;padding:0 16px;white-space:nowrap;flex-shrink:0;border:2px solid #b8d4f1;border-radius:8px;background:#fff;color:#4a90e2;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s ease;font-weight:700}.refresh-button:hover{background:#f0f8ff;border-color:#4a90e2;transform:translateY(-1px)}.refresh-button:active{transform:translateY(0)}.no-submission-button{padding:8px 16px;border:2px solid #b8d4f1;border-radius:8px;background:#fff;color:#4a90e2;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s ease;font-weight:500;white-space:nowrap}.no-submission-button:hover:not(:disabled){background:#f0f8ff;border-color:#4a90e2;transform:translateY(-1px)}.no-submission-button:active:not(:disabled){transform:translateY(0)}.no-submission-button:disabled{opacity:.5;cursor:not-allowed}.refresh-controls{display:flex;align-items:center;gap:10px}.refresh-label{display:flex;align-items:center;gap:6px;font-size:13px;color:#5a6c7d;cursor:pointer;-webkit-user-select:none;user-select:none}.refresh-label input[type=checkbox]{cursor:pointer;width:16px;height:16px}.interval-select{padding:6px 10px;font-size:13px;border:2px solid #b8d4f1;border-radius:6px;background:#fff;color:#2c3e50;cursor:pointer;transition:all .2s ease;outline:none}.interval-select:hover{border-color:#4a90e2}.interval-select:focus{border-color:#4a90e2;box-shadow:0 0 0 3px #4a90e21a}.manual-refresh-button{width:32px;height:32px;border:2px solid #b8d4f1;border-radius:6px;background:#fff;color:#4a90e2;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s ease;font-weight:700}.manual-refresh-button:hover:not(:disabled){background:#f0f8ff;border-color:#4a90e2;transform:rotate(180deg)}.manual-refresh-button:disabled{opacity:.5;cursor:not-allowed}.last-update{font-size:12px;color:#7f8c8d;white-space:nowrap}.leaderboard-table{width:100%;border-collapse:separate;border-spacing:0 8px}.leaderboard-table thead th{background:linear-gradient(135deg,#e3f2fd,#d4e9fa);color:#2c5aa0;font-weight:600;padding:12px 14px;text-align:center;font-size:14px;letter-spacing:.3px;position:sticky;top:0;z-index:5}.leaderboard-table thead th:first-child{border-radius:8px 0 0 8px;padding-left:20px}.leaderboard-table thead th:last-child{border-radius:0 8px 8px 0;padding-right:20px}.leaderboard-table tbody tr{background:#fff;transition:all .2s ease;box-shadow:0 2px 8px #0000000a}.leaderboard-table tbody tr:hover{transform:translate(4px);box-shadow:0 4px 12px #4a90e226}.leaderboard-table tbody td{padding:14px 12px;font-size:13px;color:#2c3e50;border-top:1px solid #f0f4f8;border-bottom:1px solid #f0f4f8;text-align:center}.leaderboard-table tbody td:first-child{border-left:1px solid #f0f4f8;border-radius:8px 0 0 8px;padding-left:20px}.leaderboard-table tbody td:last-child{border-right:1px solid #f0f4f8;border-radius:0 8px 8px 0;padding-right:20px}.rank-cell{font-weight:700;color:#4a90e2;font-size:16px;width:80px}.name-cell{overflow-wrap:anywhere;max-width:16rem}.leaderboard-table{min-width:48rem}.candidate-notice{color:#2c5aa0;line-height:1.6;margin:0 0 12px}.refresh-button:focus-visible{outline:3px solid #2c5aa0;outline-offset:3px}.refresh-button:disabled{opacity:.6;cursor:wait}.score-cell,.prediction-time-cell{font-family:Courier New,monospace;color:#34495e;font-weight:500}.mae-cell,.mse-cell{font-family:Courier New,monospace;color:#34495e;font-weight:400}.bold-cell{font-weight:700!important}.time-cell{color:#7f8c8d;font-size:12px}.count-cell{color:#95a5a6}.contributor-cell{text-align:center}.contributor-tag{display:inline-block;padding:4px 10px;font-size:12px;font-weight:600;border-radius:12px;transition:all .2s ease}.contributor-tag.human{background:linear-gradient(135deg,#e3f2fd,#bbdefb);color:#1565c0;box-shadow:0 1px 3px #1565c033}.contributor-tag.ai{background:linear-gradient(135deg,#f3e5f5,#e1bee7);color:#6a1b9a;box-shadow:0 1px 3px #6a1b9a33}.loading{text-align:center;padding:60px 20px;color:#7f8c8d;font-size:16px}.empty-message{text-align:center;padding:60px 20px;color:#95a5a6;font-size:16px}.error-message{text-align:center;padding:60px 20px;color:#e74c3c;font-size:16px;background:#ffebee;border-radius:8px;margin:20px}.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:#00000080;display:flex;align-items:center;justify-content:center;z-index:1000;animation:fadeIn .2s ease}@keyframes fadeIn{0%{opacity:0}to{opacity:1}}.modal-content{background:#fff;border-radius:16px;box-shadow:0 8px 32px #00000026;max-width:900px;max-height:80vh;width:90%;display:flex;flex-direction:column;animation:slideUp .3s ease}@keyframes slideUp{0%{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}.modal-header{display:flex;justify-content:space-between;align-items:center;padding:24px 30px;border-bottom:2px solid #e3f2fd;background:linear-gradient(135deg,#f5f9fc,#fff);border-radius:16px 16px 0 0}.modal-header h3{margin:0;font-size:20px;font-weight:600;color:#4a90e2}.modal-close-button{width:32px;height:32px;border:none;border-radius:8px;background:#f0f4f8;color:#7f8c8d;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s ease}.modal-close-button:hover{background:#e3f2fd;color:#4a90e2}.modal-body{padding:30px;overflow-y:auto;flex:1}.student-columns{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}.student-column{display:flex;flex-direction:column;gap:8px}.student-id-item{padding:8px 12px;background:#f8fbff;border-radius:6px;font-size:13px;color:#2c3e50;font-weight:500;text-align:center;transition:all .2s ease;border:1px solid #e3f2fd}.student-id-item:hover{background:#e3f2fd;border-color:#b8d4f1;transform:translate(2px)}@media (max-width: 768px){.modal-content{width:95%;max-height:90vh}.student-columns{grid-template-columns:repeat(2,1fr);gap:15px}.modal-header h3{font-size:18px}}.app{width:100%;min-height:100vh;background:linear-gradient(135deg,#e3f2fd,#f5f9fc);display:flex;align-items:center;justify-content:center;padding:20px}.app-container{width:100%;max-width:1800px;display:flex;gap:20px;align-items:stretch}@media (max-width: 1400px){.app-container{max-width:1400px}}@media (max-width: 1024px){.app-container{flex-direction:column}}*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Oxygen,Ubuntu,Cantarell,Fira Sans,Droid Sans,Helvetica Neue,sans-serif;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;background:linear-gradient(135deg,#e3f2fd,#f5f9fc);min-height:100vh;color:#2c3e50}#root{width:100%;min-height:100vh}::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-track{background:#f1f5f9;border-radius:4px}::-webkit-scrollbar-thumb{background:#b0c4de;border-radius:4px}::-webkit-scrollbar-thumb:hover{background:#8fa8c7}
</style>
